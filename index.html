<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>INIADの紹介</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        color: #172b3a;
        background: #f2f6f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 64px 20px;
        background: linear-gradient(145deg, #eaf5f3 0%, #f5f7fa 55%, #edf2f8 100%);
      }

      main {
        width: min(100%, 760px);
        margin: 0 auto;
      }

      header {
        margin-bottom: 28px;
        padding: 30px 34px;
        border-radius: 18px;
        color: #fff;
        background: linear-gradient(120deg, #087e78, #175b83);
        box-shadow: 0 12px 30px rgb(23 91 131 / 18%);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 2.8rem);
        letter-spacing: 0.06em;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #c8efea;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      section {
        padding: 30px 34px 34px;
        border: 1px solid #e1e9ed;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 8px 24px rgb(26 55 74 / 7%);
      }

      h2 {
        margin: 0 0 22px;
        padding-left: 14px;
        border-left: 4px solid #0b8b83;
        font-size: clamp(1.15rem, 4vw, 1.45rem);
        line-height: 1.5;
      }

      ul {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        padding: 15px 18px;
        border: 1px solid #e7eef0;
        border-radius: 10px;
        background: #f8fbfb;
        line-height: 1.7;
        transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
      }

      li:hover {
        transform: translateX(3px);
        border-color: #9bd5ce;
        background: #f0faf8;
      }

      @media (max-width: 520px) {
        body {
          padding: 32px 14px;
        }

        header,
        section {
          padding: 24px 20px;
          border-radius: 14px;
        }

        li {
          padding: 13px 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">TOYO UNIVERSITY · INIAD</p>
        <h1>INIADの紹介</h1>
      </header>
      <section>
        <h2>総合情報学科メディア専攻の教科</h2>
        <ul>
          <li>月曜2限　マルチメディアシミュレーション　メディアのためのAI基礎</li>
          <li>月曜4限</li>
          <li>火曜2限　スポーツシミュレーション</li>
          <li>水曜2限　ゲーム制作基礎</li>
          <li>水曜3・４限　メディア基礎演習</li>
          <li>水曜５限　　メディアの歴史</li>
          <li>金曜５限　　映像メディア作成技法　映像表現.映像制作基礎</li>
        </ul>
      </section>
    </main>
  </body>
</html>
